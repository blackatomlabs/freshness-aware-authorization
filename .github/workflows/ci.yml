name: CI FreshAuthz

# Runs the Python and Rego suites with pinned Python and OPA versions.
# The end-to-end Python+OPA test runs against REAL OPA and MUST NOT be skipped.
# No deployment, package publishing or containers.

on:
  push:
    branches: [ main, master ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  PYTHON_VERSION: "3.11"
  # Pinned OPA version and the SHA-256 of its official linux/amd64 static
  # binary (taken from the .sha256 file of the GitHub release). Bump both
  # together, deliberately.
  OPA_VERSION: "1.4.0"
  OPA_SHA256: "1a2337dbd75d623d759c9e47f64564f101b6923b069663f06f14377b6bb83119"

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install OPA (pinned version and pinned SHA-256)
        run: |
          set -euo pipefail
          curl -fsSL "https://github.com/open-policy-agent/opa/releases/download/v${OPA_VERSION}/opa_linux_amd64_static" -o opa
          echo "${OPA_SHA256}  opa" | sha256sum -c -
          chmod +x opa
          sudo mv opa /usr/local/bin/opa
          opa version

      - name: Python tests (includes real OPA integration)
        run: |
          set -euo pipefail
          # OPA is already on PATH: the end-to-end test MUST NOT be skipped.
          python -m unittest -v 2>&1 | tee unittest.log
          if grep -Eq "TestRealOpaIntegration.*(skipped| \.\.\. skipped)" unittest.log; then
            echo "ERROR: the end-to-end test with real OPA was skipped."; exit 1
          fi

      - name: Rego — canonical format
        run: opa fmt --fail policy.rego policy_test.rego

      - name: Rego — strict check
        run: opa check --strict policy.rego policy_test.rego

      - name: Rego — tests with coverage
        run: opa test policy.rego policy_test.rego --coverage
